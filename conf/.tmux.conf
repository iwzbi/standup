set -g prefix C-a #
unbind C-b # C-b is Ctrl+b; unbind removes the default prefix
bind C-a send-prefix # Bind Ctrl+a as the new prefix
bind-key a send-keys C-a

unbind '"'
bind - splitw -v -c '#{pane_current_path}' # Vertical split, opens in current dir
unbind %
bind | splitw -h -c '#{pane_current_path}' # Horizontal split, opens in current dir
bind c new-window -c '#{pane_current_path}' # New window keeps cwd (consistent with splits)

set-option -g mouse on # Equivalent to the 4 instructions above
set -sg escape-time 10 # 0 may swallow ESC; 10ms is imperceptible and safe
set -g history-limit 50000 # Default 2000 too low; long vim output gets truncated
set -g focus-events on # Pass focus events to apps (vim autoread, etc.)

bind -r k select-pane -U # Bind k = up
bind -r j select-pane -D # Bind j = down
bind -r h select-pane -L # Bind h = left
bind -r l select-pane -R # Bind l = right


# Ctrl+hjkl to resize pane edges
bind -r C-k resizep -U 10 # Ctrl+k = resize up 10 cells
bind -r C-j resizep -D 10 # Ctrl+j = resize down 10 cells
bind -r C-h resizep -L 10 # Ctrl+h = resize left 10 cells
bind -r C-l resizep -R 10 # Ctrl+l = resize right 10 cells

set -g base-index 1
set -g renumber-windows on # Auto-renumber on close (avoids gaps like 1,3,4)

# Window navigation / reordering
bind Tab last-window # Toggle between current and last window
bind < move-window -t -1 # Move window left
bind > move-window -t +1 # Move window right

setw -g mode-keys vi # Vi style: C-d, C-u, hjkl, etc. in copy mode
bind Escape copy-mode # Bind Esc to enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle # Visual block selection
bind i pasteb # Bind i to paste (p defaults to previous window, hence i)

set-window-option -g automatic-rename off
set-option -g allow-rename off
set -g default-terminal "tmux-256color" # Supports italic/undercurl (screen-256color doesn't)
set -ga terminal-overrides ',xterm*:Tc' # Enable 24-bit true color
set -g set-clipboard on # OSC 52: copy reaches system clipboard (tmux 3.2+)
set -g allow-passthrough on # Let apps (nvim) emit OSC 52 straight to the outer terminal; required for mosh (tmux 3.3+)

set -g default-shell /bin/zsh

# Reload config (no kill-server needed)
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# --- tmux plugin manager (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save & restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: save/restore tmux sessions
set -g @resurrect-capture-pane-contents 'on'

# Initialize tpm (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
