name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ansible-playbook configme.yaml --syntax-check
      - run: uv run ansible-lint

  # Linux: build the Docker sandbox and run the playbook twice inside it.
  # The second run must not fail — that proves idempotency (changed is fine;
  # failed is not). Matrix covers Ubuntu 22.04/24.04 (apt) and Fedora (dnf) —
  # 22.04 catches e.g. packages absent from jammy, Fedora exercises the whole
  # redhat.yml / dnf / `alt`-asset path. Entries are FULL image names so the
  # matrix is not locked to the `ubuntu:` prefix.
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "fedora:44"]
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: |
          TAG="envconfig-test-$(echo '${{ matrix.image }}' | tr ':/' '--')"
          docker build --build-arg BASE_IMAGE='${{ matrix.image }}' -t "$TAG" .
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Run playbook twice + smoke-test installed tools
        run: |
          docker run --rm "$TAG" bash -lc '
            ansible-playbook configme.yaml &&
            echo "=== second run: idempotency check ===" &&
            ansible-playbook configme.yaml &&
            echo "=== smoke test: do the tools actually run? ===" &&
            bin/smoke-test.sh'

  # macOS (Apple Silicon): install.sh already handles brew+uv bootstrap.
  # Run twice — second run must not fail. Validates the macOS path and
  # idempotency on the platform we can't test in Docker.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run install.sh twice + smoke-test installed tools
        run: |
          ./install.sh
          echo "=== second run: idempotency check ==="
          ./install.sh
          echo "=== smoke test: do the tools actually run? ==="
          bin/smoke-test.sh
