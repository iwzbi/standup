name: bump

# Weekly auto-bump of LOW-RISK pinned tools. Only github_tools entries with
# `auto: true` are bumped (zoxide/dust/eza/glow/lazydocker/gh); high-risk tools
# (neovim/atuin/yazi/delta/lazygit) stay pinned — see memory/decisions.md D010.
#
# This job only discovers + downloads + rewrites versions.yml + opens a PR. It
# does NOT run the test suite: opening the PR triggers the existing test.yml
# (on: pull_request), which runs the full ubuntu/fedora/macos playbook×2 + smoke
# matrix on the bumped versions. Merge only if that PR CI is green.
# `workflow_dispatch` lets you trigger it manually (e.g. to test the bot).

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Discover + bump auto:true tools (download + sha256, rewrite versions.yml)
        run: uv run python bin/bump-version.py --latest-all | tee /tmp/bump.log

      - name: Open a PR if any versions changed
        run: |
          if git diff --quiet -- vars/versions.yml; then
            echo "no version changes — all auto:true tools already at latest"
            exit 0
          fi
          date=$(date -u +%Y-%m-%d)
          branch="auto/bump-${date}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add vars/versions.yml
          git commit -m "chore(deps): bump low-risk tools to latest (${date})" >/dev/null
          {
            echo "### Version bumps — ${date}"
            echo ""
            echo '```'
            grep -E '\S+: .+ -> ' /tmp/bump.log || true
            echo '```'
            echo ""
            echo "Auto-generated by the weekly \`bump\` workflow (\`bump-version.py --latest-all\`)."
            echo "Only \`auto: true\` (low-risk) tools are bumped; high-risk tools stay pinned (D010)."
            echo "CI on this PR re-runs the full matrix (lint + ubuntu/fedora/macos playbook×2 + smoke)."
          } > body.md
          git push --set-upstream origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore(deps): bump low-risk tools (${date})" \
            --body-file body.md
        env:
          # PAT, not GITHUB_TOKEN: PAT-created PRs auto-run test.yml, whereas
          # GITHUB_TOKEN-created PRs are held as action_required. memory/known-issues.md.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
