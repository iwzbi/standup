# =============================================================================
# standup — centralized version manifest (single source of truth)
# =============================================================================
# Every pinned version in the playbook lives here.
#
#   Linux binaries are sha256-verified at download time.
#   macOS uses Homebrew, which is UNPINNED by design (follows `brew upgrade`),
#   so brew-managed tools have no entries here — see memory/decisions.md D001.
#
# Bump a tool:    uv run python bin/bump-version.py <tool> <new-version>
#   (downloads the asset, computes sha256, updates this file in place)
# Discover+bump:  uv run python bin/bump-version.py --latest <tool>
#   (queries the GitHub releases/latest API, then bumps that one tool)
# Bump all auto:  uv run python bin/bump-version.py --latest-all
#   (bumps every github_tools entry with `auto: true` to its latest release;
#    used by the weekly .github/workflows/bump.yml CI — see memory/decisions.md)
# Add a tool:     append to github_tools below + add the formula to
#   roles/tools/tasks/darwin.yml (if the brew name differs, set `brew:`)
# =============================================================================

# --- runtimes (managed by mise, see roles/mise) ---
node_major: "22"

# --- neovim ---
# Linux: pinned binary to ~/.local (sha256-verified, user-local — no sudo, D009).
# macOS: brew, unpinned (D001).
neovim_version: "0.11.0"
neovim_sha256: "fe0a5bc79e64c5e4d9f844cd96157ebd3919ef1343b329e9ebc3f455924cc7d6"

# --- lazygit ---
# Linux: pinned binary to ~/.local/bin (sha256-verified, user-local — no sudo, D009).
# macOS: brew, unpinned (D001).
lazygit_version: "0.44.1"
lazygit_sha256: "84682f4ad5a449d0a3ffbc8332200fe8651aee9dd91dcd8d87197ba6c2450dbc"

# --- GitHub-release binaries (Linux only; macOS uses brew) ---
# Installed by roles/tools/tasks/linux.yml via the shared roles/github_binary
# helper. On macOS these collapse to one brew install in tools/darwin.yml.
#
#   name      binary name (also the --version command and dest filename)
#   version   pinned release version (without leading 'v'; URL adds 'v' if needed)
#   sha256    of the linux x86_64 asset (verified by get_url checksum)
#   url       release URL with {version} placeholder
#   type      deb | archive
#   alt       optional {url, sha256, type} used INSTEAD of url/sha256/type on
#             RedHat-family hosts (Fedora/RHEL, dnf), which have no dpkg-deb to
#             extract a .deb. Always an archive there. Only needed by deb-typed
#             tools — see memory/decisions.md D018.
#   dest      user (~/.local/bin, no sudo) | system (/usr/local/bin, sudo)
#   binaries  optional list of binaries to install from the archive (default [name])
#   brew      optional Homebrew formula name if it differs from `name`
#   auto      optional true — safe to auto-bump in the weekly CI. Only low
#             compat-risk tools get this (zoxide/dust/eza/glow/lazydocker/gh).
#             High-risk tools (neovim/atuin/yazi/delta/lazygit) OMIT it and are
#             bumped manually after a human review (see memory/decisions.md D010).
# -----------------------------------------------------------------------------
github_tools:
  - name: delta
    version: "0.19.2"
    sha256: "ea4f0222950ee750a3d38dd80d03bce4cee07a3f63928fc47548383bcaf23093"
    url: "https://github.com/dandavison/delta/releases/download/{version}/git-delta_{version}_amd64.deb"
    type: deb
    # dnf hosts have no dpkg-deb: use the upstream gnu tarball instead.
    alt:
      url: "https://github.com/dandavison/delta/releases/download/{version}/delta-{version}-x86_64-unknown-linux-gnu.tar.gz"
      sha256: "8e695c5f586a8c53d6c3b01be0b4a422ed218bfed2a56191caebe373a1c18ab2"
      type: archive
    dest: user
    brew: git-delta
  - name: zoxide
    version: "0.10.0"
    sha256: "2d93385b99f3e82cf2701609a1bffcad863fbeb75aa3fe7eb6be4d29be68b1ae"
    url: "https://github.com/ajeetdsouza/zoxide/releases/download/v{version}/zoxide-{version}-x86_64-unknown-linux-musl.tar.gz"
    type: archive
    dest: user
    auto: true
  - name: eza
    version: "0.23.5"
    sha256: "e06eebab74b73d6b7d51a796a353824b001bea82df077706382e100815d28904"
    url: "https://github.com/eza-community/eza/releases/download/v{version}/eza_x86_64-unknown-linux-musl.tar.gz"
    type: archive
    dest: user
    auto: true
  - name: dust
    version: "1.2.6"
    sha256: "14f788707aad217667f6812cf1a9639bf5c861a2ee815d486cffc36051f5e759"
    url: "https://github.com/bootandy/dust/releases/download/v{version}/dust-v{version}-x86_64-unknown-linux-gnu.tar.gz"
    type: archive
    dest: user
    auto: true
  - name: lazydocker
    version: "0.25.2"
    sha256: "0d9dbfc26068b218e7ed84b104748cadc6e3cf733c0afd35465306fb39b9523c"
    url: "https://github.com/jesseduffield/lazydocker/releases/download/v{version}/lazydocker_{version}_Linux_x86_64.tar.gz"
    type: archive
    dest: user
    auto: true
  - name: yazi
    version: "26.8.15"
    sha256: "a6702034790afcdbb546b73b288c9b184a751fa3f2f17f0ad4d26fc302fb8d45"
    url: "https://github.com/sxyazi/yazi/releases/download/v{version}/yazi-x86_64-unknown-linux-musl.zip"
    type: archive
    dest: user
    binaries: [yazi, ya]
  - name: glow
    version: "3.0.0"
    sha256: "13e05e4b2acc18d2aee44291aefe6325b077ec321b631a0cfa780e8e3bc33f78"
    url: "https://github.com/charmbracelet/glow/releases/download/v{version}/glow_{version}_Linux_x86_64.tar.gz"
    type: archive
    dest: user
    auto: true
  - name: atuin
    version: "18.20.1"
    sha256: "1ad3e8162b4570118a3e05ae6b9ca0575aad0bb018a83001805c4f52d4fe9c8f"
    url: "https://github.com/atuinsh/atuin/releases/download/v{version}/atuin-x86_64-unknown-linux-musl.tar.gz"
    type: archive
    dest: user
  # gh (GitHub CLI): installed from its .deb so it works on Ubuntu 22.04 too,
  # where `gh` is NOT in the default apt archives (only 24.04+ has it). On macOS
  # the `packages` role installs it via Homebrew (brew name == "gh"); on dnf
  # hosts the upstream tarball is used instead (no dpkg-deb — D018).
  - name: gh
    version: "2.103.2"
    sha256: "30463d8e1fdce73f178f76b0082b7ab0657b0740b87274890e831def647ca979"
    url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_linux_amd64.deb"
    type: deb
    alt:
      url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_linux_amd64.tar.gz"
      sha256: "62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8"
      type: archive
    dest: user
    brew: gh
    auto: true
  # age: modern encryption (X25519 + ChaCha20-Poly1305). Crypto backend for the
  # passage secret store (D017). age-keygen ships in the same archive.
  # Manually bumped (no `auto:`) — stable crypto tool, rarely needs updates.
  - name: age
    version: "1.3.1"
    sha256: "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
    url: "https://github.com/FiloSottile/age/releases/download/v{version}/age-v{version}-linux-amd64.tar.gz"
    type: archive
    dest: user
    binaries: [age, age-keygen]
    brew: age
