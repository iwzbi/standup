# mise — unified runtime version manager (replaces nvm). Single code path on
# both Linux and macOS via the mise.run installer (no brew dependency on mac,
# so the node toolchain is identical across platforms). See memory/decisions.md D003.
#
# The legacy ~/.nvm directory is intentionally NOT removed (user data left
# alone); it simply stops being sourced once conf/.zshrc switches to mise.
#
# Install path uses a block/rescue (D016): mise.run is just a redirect to the
# GitHub release's install.sh. In a "red zone" network the mise.run redirect
# tunnel can 403 while github.com is still reachable directly — the rescue
# fetches the SAME installer via its stable GitHub URL, landing mise in
# ~/.local/bin/mise exactly like the primary path.
#
# install.sh has THREE network layers, each of which a red zone can 403
# independently — the block/rescue must cover all three or the fallback is
# useless:
#   1. the installer script  → mise.run; the rescue uses github.com (D016).
#   2. the mise binary tarball → mise.jdx.dev by default; MISE_INSTALL_FROM_GITHUB=1
#      switches it to github.com.
#   3. the version index → https://mise.jdx.dev/releases.tsv, fetched by
#      install.sh UNLESS MISE_VERSION is set (MISE_INSTALL_FROM_GITHUB does NOT
#      affect it). So we resolve the latest tag from github.com's
#      /releases/latest redirect and pass it as MISE_VERSION, keeping layer 3
#      off mise.jdx.dev entirely. If github is unreachable too the resolve
#      yields empty and behaviour is unchanged (a pre-staged binary still wins
#      via its `creates:` gate).

- name: Resolve latest mise tag from github.com (skips the mise.jdx.dev release index, D016)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sI https://github.com/jdx/mise/releases/latest \
      | sed -n 's#.*/tag/\(v[0-9][0-9.]*\).*#\1#p'
  args:
    executable: /bin/bash
  register: mise_latest_tag
  changed_when: false
  failed_when: false
  tags: [mise]

- name: Install mise (mise.run, with GitHub-direct fallback)
  block:
    - name: Download mise installer (mise.run)
      ansible.builtin.get_url:
        url: https://mise.run
        dest: /tmp/mise-install.sh
        mode: "0755"
      register: mise_installer
      tags: [mise]

    - name: Install mise
      ansible.builtin.command: /tmp/mise-install.sh
      args:
        creates: "{{ ansible_facts.user_dir }}/.local/bin/mise"
      environment:
        MISE_INSTALL_FROM_GITHUB: "1"
        MISE_VERSION: "{{ mise_latest_tag.stdout | default('') | trim }}"
      tags: [mise]
  rescue:
    - name: Download mise installer (GitHub direct fallback, D016)
      ansible.builtin.get_url:
        url: https://github.com/jdx/mise/releases/latest/download/install.sh
        dest: /tmp/mise-install.sh
        mode: "0755"
      register: mise_installer
      tags: [mise]

    - name: Install mise (GitHub direct fallback, D016)
      ansible.builtin.command: /tmp/mise-install.sh
      args:
        creates: "{{ ansible_facts.user_dir }}/.local/bin/mise"
      environment:
        MISE_INSTALL_FROM_GITHUB: "1"
        MISE_VERSION: "{{ mise_latest_tag.stdout | default('') | trim }}"
      tags: [mise]

- name: Check installed node via mise
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.local/bin/mise ls --current node"
  register: mise_node_current
  changed_when: false
  failed_when: false
  tags: [mise]

- name: Install Node.js via mise ({{ node_major }})
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.local/bin/mise use -g node@{{ node_major }}"
  when: "node_major not in mise_node_current.stdout"
  changed_when: true
  tags: [mise]
