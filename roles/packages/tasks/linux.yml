# Linux: platform-neutral setup first, then dispatch to the distro's own
# package-manager tasks by os_family:
#   Debian (Ubuntu/Debian) -> debian.yml (apt)
#   RedHat  (Fedora/RHEL)   -> redhat.yml  (dnf)
# Any other os_family gets a clear "file not found" from include_tasks —
# adding a distro means adding one file here, not editing this one.
- name: Check whether an HTTP(S) proxy is configured
  ansible.builtin.set_fact:
    packages_proxy_configured: >-
      {{
        (lookup('ansible.builtin.env', 'http_proxy') | length > 0)
        or (lookup('ansible.builtin.env', 'https_proxy') | length > 0)
        or (lookup('ansible.builtin.env', 'HTTP_PROXY') | length > 0)
        or (lookup('ansible.builtin.env', 'HTTPS_PROXY') | length > 0)
      }}
  tags: [packages]

- name: Dispatch to the distro's package-manager tasks
  ansible.builtin.include_tasks: "{{ ansible_facts.os_family | lower }}.yml"
  tags: [packages]
