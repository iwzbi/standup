# Internal helper role — installs ONE GitHub-release binary (see
# vars/versions.yml :: github_tools) into ~/.local/bin (user-local, no sudo)
# or /usr/local/bin (sudo). Called via include_role from tools/tasks/linux.yml.
#
# .deb assets are extracted with `dpkg-deb -x` (NOT apt) so NO sudo is needed
# even for deb-based tools (delta, gh) — we only need the binary, not the
# system package metadata. See memory/decisions.md D009 (sudo minimization).
# dpkg-deb only exists on Debian-family hosts: on RedHat-family hosts (dnf)
# a deb-typed tool falls back to the tool's `alt` tarball asset instead — see
# memory/decisions.md D018.
#
# Idempotent: the caller gates this on a version check, so it only runs when
# the tool is missing or at a different version. get_url's checksum makes the
# download idempotent within a run.
#
# Every task carries `tags: always` (D013): this role is loaded via a dynamic
# include_role whose caller is tagged with each tool name so `--tags <tool>`
# selects it. But Ansible filters a dynamic include's INNER tasks by their own
# tags — without `always`, untagged inner tasks are skipped under
# `--tags <tool>` and the binary never installs (only the caller's
# version-check ran; `./install.sh --tags gh` silently did nothing). `always`
# defeats the `--tags` filter so the tasks run whenever the include that loads
# them runs, restoring the documented per-tool `--tags <tool>` selection. It
# does NOT override `when`: the caller's version-mismatch `when` still gates
# whether the include runs at all, and each task's own `when` still applies.

- name: Resolve install settings ({{ github_binary_tool.name }})
  ansible.builtin.set_fact:
    github_binary_dir: "{{ '/usr/local/bin' if (github_binary_tool.dest | default('user')) == 'system' else ansible_facts.user_dir ~ '/.local/bin' }}"
    github_binary_become: "{{ (github_binary_tool.dest | default('user')) == 'system' }}"
    github_binary_file: "/tmp/{{ github_binary_tool.name }}-{{ github_binary_tool.version }}.asset"
    github_binary_extract: "/tmp/{{ github_binary_tool.name }}-{{ github_binary_tool.version }}_extract"
  tags: always

# Pick the release asset for this host family. Debian keeps the primary `url`
# (a .deb, extracted with dpkg-deb below). RedHat has no dpkg-deb, so a tool
# that carries an `alt` block uses that instead (always an archive — see
# vars/versions.yml). Tools with no `alt` are already archives and are
# unaffected, which is why only delta and gh define one (D018).
- name: Resolve release asset ({{ github_binary_tool.name }})
  ansible.builtin.set_fact:
    github_binary_asset: >-
      {{
        github_binary_tool.alt
        if (github_binary_tool.alt is defined and ansible_facts.os_family != 'Debian')
        else {
          'url': github_binary_tool.url,
          'sha256': github_binary_tool.sha256,
          'type': github_binary_tool.type | default('archive'),
        }
      }}
  tags: always

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ github_binary_dir }}"
    state: directory
    mode: "0755"
  become: "{{ github_binary_become }}"
  tags: always

- name: Download release ({{ github_binary_tool.name ~ "-" ~ github_binary_tool.version }})
  ansible.builtin.get_url:
    url: "{{ github_binary_asset.url | replace('{version}', github_binary_tool.version) }}"
    dest: "{{ github_binary_file }}"
    checksum: "sha256:{{ github_binary_asset.sha256 }}"
    mode: "0644"
  register: github_binary_download
  tags: always

- name: Create extract directory ({{ github_binary_tool.name }})
  ansible.builtin.file:
    path: "{{ github_binary_extract }}"
    state: directory
    mode: "0755"
  when: github_binary_download.changed
  tags: always

- name: Extract .deb ({{ github_binary_tool.name }})
  ansible.builtin.command: "dpkg-deb -x {{ github_binary_file }} {{ github_binary_extract }}"
  when: github_binary_asset.type == 'deb' and github_binary_download.changed
  changed_when: true
  tags: always

- name: Extract archive ({{ github_binary_tool.name }})
  ansible.builtin.unarchive:
    src: "{{ github_binary_file }}"
    dest: "{{ github_binary_extract }}"
    remote_src: true
  when: github_binary_asset.type != 'deb' and github_binary_download.changed
  tags: always

- name: Install binaries ({{ github_binary_tool.name }})
  ansible.builtin.shell: |
    set -o pipefail
    # Exclude share/bash-completion/completions: .deb releases ship a same-named
    # completion file (e.g. usr/share/bash-completion/completions/gh) that find
    # can match BEFORE the real binary under usr/bin/, installing the shell
    # script as the binary (D012). Real binaries live under usr/bin/ (deb) or
    # the archive root / a bin/ dir (tarball) — never under these paths, so the
    # exclusions are safe and make selection deterministic across filesystems.
    src=$(find "{{ github_binary_extract }}" -type f -name "{{ github_binary_bin }}" \
          ! -path "*/share/*" ! -path "*/bash-completion/*" ! -path "*/completions/*" \
          | head -1)
    if [ -z "$src" ]; then echo "binary {{ github_binary_bin }} not found in archive" >&2; exit 1; fi
    install -m 0755 "$src" "{{ github_binary_dir }}/{{ github_binary_bin }}"
  args:
    executable: /bin/bash
  loop: "{{ github_binary_tool.binaries | default([github_binary_tool.name]) }}"
  loop_control:
    loop_var: github_binary_bin
  become: "{{ github_binary_become }}"
  when: github_binary_download.changed
  changed_when: true
  tags: always
